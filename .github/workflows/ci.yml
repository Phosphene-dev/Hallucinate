name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: |
          pip install pip-audit
          python scripts/audit_deps.py audit
          pip-audit -r audit/deps.txt
          pip-audit --no-deps --disable-pip -r audit/flatpak.txt
          # the exact versions the release builds install
          pip-audit --no-deps --disable-pip -r packaging/build-requirements.txt
          pip-audit --no-deps --disable-pip -r packaging/appimage/appimage-tools.txt
          pip-audit --no-deps --disable-pip -r packaging/server/build-tools.txt

  test:
    # Pinned: on the newer ubuntu-latest image (PulseAudio 17), PySide6 6.12 crashes creating QMediaDevices
    # in CI's bare audio setup. Move back to ubuntu-latest once a newer PySide6 runs there.
    runs-on: ubuntu-24.04
    # the suite takes ~7 minutes; a slow package mirror has taken the rest of a 15-minute limit
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages
        run: |
          # A slow mirror once ran this past the job's time limit: give up on a stalled connection and retry, and
          # leave out recommended packages (most of the download)
          apt="sudo apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libxcb-cursor0 dbus pulseaudio pulseaudio-utils
      - run: pip install -e '.[test]'
      - run: dbus-run-session -- pytest -vv

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # Media controls against the real Windows API, plus an offscreen launch with them enabled.
      - run: pytest -vv tests/test_smtc.py tests/test_app_smoke.py

  flatpak:
    # each processor the Flatpak is built for: x86_64, and aarch64 (Linux phones, ARM laptops: #130)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    name: flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Flatpak and Flathub's builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ffmpeg
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Build Flatpak
        run: |
          # The sandboxed builder installs dependencies through the host's flatpak over D-Bus. Mirroring the
          # screenshots into the repo is only for the linter below.
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --mirror-screenshots-url=https://dl.flathub.org/media/ --default-branch=stable \
            --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.phosphene_dev.Hallucinate.yml
      - name: Flatpak linter
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest packaging/flatpak/io.github.phosphene_dev.Hallucinate.yml
          # Two checks are about how Flathub's own servers rewrite media URLs, which don't apply here
          # (packaging/flatpak/lint-exceptions.json).
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json repo flatpak-repo
      - name: Publish with a throwaway key, then install from the bundle
        run: |
          # The same steps as a release (release.yml), signed with a key made for this run only.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "Hallucinate CI throwaway key" rsa4096 sign never
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          gpg --batch --export "$key" > "$RUNNER_TEMP/ci-key.gpg"
          packaging/flatpak/publish.sh flatpak-repo "$key" "$GNUPGHOME" "$RUNNER_TEMP/ci-key.gpg" hallucinate.flatpak
          # the signed repository is accepted with the key, as users' Flatpak will see it
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/ci-key.gpg" ci-repo "file://$PWD/flatpak-repo"
          flatpak remote-ls --user ci-repo | grep -q io.github.phosphene_dev.Hallucinate
          flatpak remote-delete --user ci-repo
          flatpak install --user -y --noninteractive hallucinate.flatpak
      - name: Smoke test (offscreen)
        run: |
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen \
            --env=HALLUCINATE_DISABLE_LEGACY_MIGRATION=1 \
            --env=HALLUCINATE_CONTROL_SOCKET=hallucinate-flatpak-smoke \
            io.github.phosphene_dev.Hallucinate --quit-after 3000
      - name: Audio decodes inside the Flatpak
        run: |
          clips="$RUNNER_TEMP/clips"
          mkdir -p "$clips"
          src=(-loglevel error -f lavfi -i sine=frequency=440:duration=3 -ac 2)
          ffmpeg "${src[@]}" -c:a libmp3lame "$clips/tone.mp3"
          ffmpeg "${src[@]}" -c:a aac "$clips/aac.m4a"
          ffmpeg "${src[@]}" -c:a alac "$clips/alac.m4a"
          ffmpeg "${src[@]}" -c:a flac "$clips/tone.flac"
          ffmpeg "${src[@]}" -c:a libvorbis "$clips/tone.ogg"
          ffmpeg "${src[@]}" -c:a libopus "$clips/tone.opus"
          cp packaging/flatpak/decode_check.py "$clips/"
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen --filesystem="$clips":ro \
            --command=python3 io.github.phosphene_dev.Hallucinate "$clips/decode_check.py" \
            "$clips/tone.mp3" "$clips/aac.m4a" "$clips/alac.m4a" "$clips/tone.flac" \
            "$clips/tone.ogg" "$clips/tone.opus"
      - name: Why Qt has no sound backend (when the check above fails)
        if: failure()
        run: |
          plugin=$(flatpak run --command=sh io.github.phosphene_dev.Hallucinate -c \
            'ls /app/lib/python3*/site-packages/PySide6/Qt/plugins/multimedia/*.so')
          echo "plugins: $plugin"
          flatpak run --command=sh io.github.phosphene_dev.Hallucinate -c \
            "ldd $plugin /app/lib/python3*/site-packages/PySide6/Qt/lib/libQt6Multimedia.so.6 | grep -E 'not found|=> /usr' | sort -u" || true
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen --env=QT_DEBUG_PLUGINS=1 \
            --command=python3 io.github.phosphene_dev.Hallucinate -c \
            "from PySide6.QtWidgets import QApplication; from PySide6.QtMultimedia import QMediaPlayer; a = QApplication([]); QMediaPlayer()" \
            2>&1 | grep -iE "multimedia|ffmpeg|cannot|error|not found|failed" | head -40 || true

  aur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git namcap python-build python-installer python-setuptools \
            python-wheel pyside6 python-mutagen python-keyring python-numpy qt6-multimedia-ffmpeg qt6-declarative
          useradd -m builder
          chown -R builder .
      - name: .SRCINFO matches PKGBUILD
        run: |
          for p in hallucinate hallucinate-git; do
            (cd "packaging/aur/$p" && sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -)
          done
      - name: Build, lint and install the stable package
        working-directory: packaging/aur/hallucinate
        run: |
          sudo -u builder makepkg --noconfirm
          namcap PKGBUILD ./*.pkg.tar.zst
          pacman -U --noconfirm ./*.pkg.tar.zst
      - name: Build this checkout the way hallucinate-git does
        run: sudo -u builder python -m build --wheel --no-isolation --outdir /tmp/git-build
      - name: Smoke test the installed package (offscreen)
        run: |
          sudo -u builder -H env QT_QPA_PLATFORM=offscreen HALLUCINATE_DISABLE_LEGACY_MIGRATION=1 \
            HALLUCINATE_CONTROL_SOCKET=hallucinate-aur-smoke timeout 60 hallucinate --quit-after 3000

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the flake
        run: nix build -L
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-nix-smoke
        run: |
          timeout 60 ./result/bin/hallucinate --quit-after 3000
          timeout 120 ./result/bin/hallucinate --decode-check packaging/testclips/*

  container:
    # The headless server image (packaging/server/Dockerfile): builds, starts without a window, answers the command
    # line from outside, and stops cleanly.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f packaging/server/Dockerfile -t hallucinate .
      - name: Run it headless, pair and ask what's playing, stop it
        run: |
          docker run -d --name hl -p 127.0.0.1:8483:8483 -v "$PWD/packaging/testclips:/music:ro" hallucinate
          for i in $(seq 1 60); do docker logs hl 2>&1 | grep -q "running without a window" && break; sleep 1; done
          docker logs hl 2>&1 | grep "running without a window"
          docker exec hl hallucinate cmd library
          docker exec hl hallucinate --pair | grep -E "Pairing code: [0-9]{6}"
          docker exec hl hallucinate cmd status
          curl -fsS http://127.0.0.1:8483/api/hello | grep -q '"paired": false'
          docker stop -t 20 hl
          docker logs hl 2>&1 | grep "Stopping"
          test "$(docker inspect -f '{{.State.ExitCode}}' hl)" = 0
