[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinate"
version = "2.0.0"
description = "A fast desktop music player for the music you own: liquid, cover-coloured, gapless and private"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # PySide6 6.12.0 drops a reference to True on every signal emit; Python 3.12+ is immune (True is immortal),
    # older Pythons eventually free True and crash. Lift this once a fixed PySide6 is released.
    "PySide6>=6.11.2,<6.12; python_version < '3.12'",
    "PySide6>=6.11.2; python_version >= '3.12'",
    "mutagen>=1.48.1",
    "keyring>=25.7.0",
    "numpy>=1.24",
    # Windows media controls (SMTC)
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://phosphene-dev.github.io/Hallucinate/"
Source = "https://github.com/Phosphene-dev/Hallucinate"
Issues = "https://github.com/Phosphene-dev/Hallucinate/issues"
Changelog = "https://github.com/Phosphene-dev/Hallucinate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]
icons = ["Pillow>=9"]

[project.gui-scripts]
hallucinate = "hallucinate.app:main"
musicplayer = "hallucinate.app:main"

[tool.setuptools]
# The folders of QML, pictures, fonts, themes and the web remote are listed as packages of their own: newer
# setuptools warns about folders it could import but wasn't told of, and python-appimage (the AppImage's
# builder) takes any warning as a failed build.
packages = ["hallucinate", "hallucinate.core", "hallucinate.core.cast", "hallucinate.qml", "hallucinate.qml.shaders",
            "hallucinate.qml.HallucinateStyle", "hallucinate.assets", "hallucinate.assets.fonts", "hallucinate.themes",
            "hallucinate.web", "hallucinate.i18n", "musicplayer"]

[tool.setuptools.package-data]
"hallucinate.i18n" = ["*.qm", "*.ts"]
"hallucinate.qml" = ["*"]
"hallucinate.qml.shaders" = ["*"]
"hallucinate.qml.HallucinateStyle" = ["*"]
"hallucinate.assets" = ["*"]
"hallucinate.assets.fonts" = ["*"]
"hallucinate.themes" = ["*.json"]
"hallucinate.web" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E701", "E702", "E501", "E741", "F841"]
