app-id: io.github.phosphene_dev.Hallucinate
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: hallucinate
finish-args:
  - --share=ipc
  - --share=network # Last.fm, ListenBrainz, cover art and lyrics lookups
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures/Hallucinate:create # recap cards and spectrograms; nothing else in Pictures
  # Read-only: the signal path reads PipeWire's allowed sample rates (pipewire.conf.d) to tell whether the
  # output follows each song's rate or converts it
  - --filesystem=xdg-config/pipewire:ro
  - --own-name=org.mpris.MediaPlayer2.hallucinate
  - --talk-name=org.freedesktop.secrets # Last.fm/ListenBrainz credentials in the system keyring
  - --talk-name=org.freedesktop.Notifications # opt-in track-change notifications
  # Show in folder for the images it saves in Pictures/Hallucinate: the portal won't open files the app can write
  - --talk-name=org.freedesktop.FileManager1
  # The tray icon (StatusNotifierItem, as KDE, GNOME's AppIndicator extension, Waybar and noctalia show it);
  # without it Qt finds no tray inside the sandbox and the icon never appears
  - --talk-name=org.kde.StatusNotifierWatcher
  # Discord Rich Presence IPC socket. Flatpak Discord also links its socket here; mounting
  # xdg-run/app/... instead would collide with Flatpak's own $XDG_RUNTIME_DIR/app symlink.
  - --filesystem=xdg-run/discord-ipc-0
  # PySide6 brings its own Qt (below): keep it from loading the runtime's Qt plugins and QML modules, which are
  # built for a different Qt release
  - --env=QT_PLUGIN_PATH=
  - --env=QML_IMPORT_PATH=
  - --env=QML2_IMPORT_PATH=
modules:
  # PySide6 from its own wheels, with the Qt it was built against inside them, like the AppImage. Not the runtime's
  # Qt (through io.qt.PySide.BaseApp): PySide6 uses Qt's private API, which changes with every Qt patch release,
  # and the runtime updates on its own, so each runtime update stopped the app from starting until a rebuild.
  # Qt's network library links to Kerberos (GSSAPI), which the KDE runtime doesn't carry. Only the libraries.
  - name: krb5
    buildsystem: simple
    subdir: src
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=${FLATPAK_DEST} --disable-static --disable-rpath --with-crypto-impl=builtin
        --without-system-verto --without-ldap --without-keyutils --without-libedit --without-readline
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/examples
      - /share/et
      - /var
    sources:
      - type: git
        url: https://github.com/krb5/krb5.git
        tag: krb5-1.22.2-final
        commit: 8570e77819563e036027e1da789d08ec9333ed4d
  - name: pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-index --no-build-isolation --prefix=${FLATPAK_DEST} *.whl
      - python3 qt_prune.py ${FLATPAK_DEST}/lib/python3*/site-packages # drop the parts of Qt the app never uses
    sources:
      # The same versions and checksums as the other release builds (packaging/build-requirements.txt)
      - type: file
        url: https://files.pythonhosted.org/packages/49/c2/a04fa003b4360e99d8e3fc2829abacf37396ace63ea1cd616402209ec7c6/shiboken6-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 3bde565bb0890044b5c7f63808adddede5abc241e9395a2bfed61919884d6240
      - type: file
        url: https://files.pythonhosted.org/packages/2f/53/db0cabed1e70d0bc4666b8cbc2611b72bff2f9d2c4813820182621a8c6ee/pyside6-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: d13ed4d0053cc20f3e4e0fdbf12790a9b7f958d7e22c0843411ecfa8c799e2a9
      - type: file
        url: https://files.pythonhosted.org/packages/7b/3c/7597d8dcb36aa8315427635ec6ec9d850ffbad4ce78b9118ac854889f2d3/pyside6_essentials-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 16f4b5e41daf49235ae048458243da9efe5f3d8040f9cc5aa454ce69893d3bd9
      - type: file
        url: https://files.pythonhosted.org/packages/ff/3e/0d6c5934de575286ac0699a701d4155048185035b8da0ee78d57a38bc7ef/pyside6_addons-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 4ab38c0017f0453671a9313d3a53ca1c0e378924f54b07e596bcea94a9642391
      - type: file
        url: https://files.pythonhosted.org/packages/da/24/3bd070f3269dc609d8f26b2643f62ef91bb415841c0b294805aaf7fe06da/numpy-2.5.4-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 6ffa07666f8da0eef81d149934a626d0d95fbd6838432a33e66245423a9062c0
      - type: file
        path: ../qt_prune.py
  - python3-requirements.yaml
  - name: hallucinate
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --no-index --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/hallucinate.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/hallucinate.png
        ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: dir # this checkout: CI builds pull requests and releases build their tag
        path: ../..
