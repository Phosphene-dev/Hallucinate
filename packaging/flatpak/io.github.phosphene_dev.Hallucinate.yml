  - python3-requirements.yaml
  - name: hallucinate
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --no-index --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/hallucinate.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/hallucinate.png
        ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
