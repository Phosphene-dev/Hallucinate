app-id: io.github.phosphene_dev.Hallucinate
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: hallucinate
finish-args:
  - --share=ipc
  - --share=network # Last.fm, ListenBrainz, cover art and lyrics lookups
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures/Hallucinate:create # recap cards and spectrograms; nothing else in Pictures
  # Read-only: the signal path reads PipeWire's allowed sample rates (pipewire.conf.d) to tell whether the
  # output follows each song's rate or converts it
  - --filesystem=xdg-config/pipewire:ro
  - --own-name=org.mpris.MediaPlayer2.hallucinate
  - --talk-name=org.freedesktop.secrets # Last.fm/ListenBrainz credentials in the system keyring
  - --talk-name=org.freedesktop.Notifications # opt-in track-change notifications
  # The tray icon (StatusNotifierItem, as KDE, GNOME's AppIndicator extension, Waybar and noctalia show it);
  # without it Qt finds no tray inside the sandbox and the icon never appears
  - --talk-name=org.kde.StatusNotifierWatcher
  # Discord Rich Presence IPC socket. Flatpak Discord also links its socket here; mounting
  # xdg-run/app/... instead would collide with Flatpak's own $XDG_RUNTIME_DIR/app symlink.
  - --filesystem=xdg-run/discord-ipc-0
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1" # Hallucinate doesn't use QtWebEngine; drop it from the bundle
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - python3-requirements.yaml
  - name: hallucinate
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --no-index --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/hallucinate.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/hallucinate.png
        ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: dir # this checkout: CI builds pull requests and releases build their tag
        path: ../..
