# The .deb and .rpm: the AppImage's own AppDir (Python, PySide6 and the app, as tested) installed under
# /opt/hallucinate, with a command, a launcher and icons where the system looks for them. Built by
# packaging/linux/build.sh, which fills in VERSION, APPDIR and REPO.
name: hallucinate
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: sound
priority: optional
maintainer: Phosphene <noreply@github.com>
description: |
  Music library and player with instant search.
  Albums, artists, genres and composers, gapless playback, ReplayGain, a headphone EQ, lyrics, scrobbling,
  internet radio and podcasts. Python and Qt are bundled, so it doesn't depend on the system's versions.
vendor: Phosphene
homepage: https://github.com/Phosphene-dev/Hallucinate
license: MIT

contents:
  - src: ${APPDIR}/
    dst: /opt/hallucinate
    type: tree
  - src: ${REPO}/packaging/linux/hallucinate
    dst: /usr/bin/hallucinate
    file_info:
      mode: 0755
  - src: ${REPO}/packaging/hallucinate.desktop
    dst: /usr/share/applications/hallucinate.desktop
  - src: ${REPO}/packaging/icons/hicolor/
    dst: /usr/share/icons/hicolor
    type: tree

# What the bundle needs from the system: every library its own files link to that it doesn't carry (found with
# objdump over the AppDir), less the optional plugins' (the GTK theme, EGLFS on a bare console). The FFmpeg audio
# backend needs the X11 and DRM ones even on Wayland.
overrides:
  deb:
    depends:
      - libc6
      - libstdc++6
      - libegl1
      - libgl1
      - libglib2.0-0t64 | libglib2.0-0
      - libfontconfig1
      - libfreetype6
      - libdbus-1-3
      - libpulse0
      - zlib1g
      - libzstd1
      - libbrotli1
      - libgssapi-krb5-2
      - libuuid1
      - libdrm2
      - libx11-6
      - libx11-xcb1
      - libxext6
      - libxrandr2
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libxcb-cursor0
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
  rpm:
    # by library rather than package name: the same on Fedora, openSUSE and the rest
    depends:
      - libstdc++.so.6()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgobject-2.0.so.0()(64bit)
      - libgio-2.0.so.0()(64bit)
      - libgthread-2.0.so.0()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libdbus-1.so.3()(64bit)
      - libpulse.so.0()(64bit)
      - libz.so.1()(64bit)
      - libzstd.so.1()(64bit)
      - libbrotlicommon.so.1()(64bit)
      - libbrotlidec.so.1()(64bit)
      - libgssapi_krb5.so.2()(64bit)
      - libuuid.so.1()(64bit)
      - libdrm.so.2()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libxcb.so.1()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libxcb-glx.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-image.so.0()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-randr.so.0()(64bit)
      - libxcb-render.so.0()(64bit)
      - libxcb-render-util.so.0()(64bit)
      - libxcb-shape.so.0()(64bit)
      - libxcb-shm.so.0()(64bit)
      - libxcb-sync.so.1()(64bit)
      - libxcb-util.so.1()(64bit)
      - libxcb-xfixes.so.0()(64bit)
      - libxcb-xkb.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)

deb:
  compression: zstd
rpm:
  compression: zstd
  group: Applications/Multimedia
