# The .deb and .rpm: the AppImage's own AppDir (Python, PySide6 and the app, as tested) installed under
# /opt/hallucinate, with a command, a launcher and icons where the system looks for them. Built by
# packaging/linux/build.sh, which fills in VERSION, APPDIR and REPO.
name: hallucinate
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: sound
priority: optional
maintainer: Phosphene <noreply@github.com>
description: |
  Music library and player with instant search.
  Albums, artists, genres and composers, gapless playback, ReplayGain, a headphone EQ, lyrics, scrobbling,
  internet radio and podcasts. Python and Qt are bundled, so it doesn't depend on the system's versions.
vendor: Phosphene
homepage: https://github.com/Phosphene-dev/Hallucinate
license: MIT

contents:
  - src: ${APPDIR}/
    dst: /opt/hallucinate
    type: tree
  - src: ${REPO}/packaging/linux/hallucinate
    dst: /usr/bin/hallucinate
    file_info:
      mode: 0755
  - src: ${REPO}/packaging/hallucinate.desktop
    dst: /usr/share/applications/hallucinate.desktop
  - src: ${REPO}/packaging/icons/hicolor/
    dst: /usr/share/icons/hicolor
    type: tree

overrides:
  deb:
    depends:
      - libegl1
      - libgl1
      - libxkbcommon0
      - libxcb-cursor0
      - libdbus-1-3
      - libfontconfig1
      - libpulse0
  rpm:
    # by library rather than package name: the same on Fedora, openSUSE and the rest
    depends:
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libdbus-1.so.3()(64bit)
      - libfontconfig.so.1()(64bit)
      - libpulse.so.0()(64bit)

deb:
  compression: zstd
rpm:
  compression: zstd
  group: Applications/Multimedia
